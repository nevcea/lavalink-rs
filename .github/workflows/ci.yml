name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace
        run: cargo check --workspace

  audit:
    name: Audit
    runs-on: ubuntu-latest
    # audit-check publishes its report as a Check Run, which needs `checks:
    # write` on top of the default token; without it, publishing itself throws
    # and fails the job regardless of what cargo-audit found.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ten advisories, none fixable by a version bump on our end. Eight are
          # pulled in transitively through songbird 0.6.0 (tungstenite's rustls
          # 0.22 -> old rustls-webpki), which is itself the newest songbird
          # release — no newer compatible version to move to yet.
          #
          # The remaining two, both libcrux-aesgcm (RUSTSEC-2026-0211, -0209),
          # come from `driver`'s unconditional davey (DAVE E2EE) dependency and
          # *are* patched upstream (libcrux-aesgcm 0.0.9) — the block is one
          # level up: hpke-rs 0.6.1 pins hpke-rs-libcrux to `^0.6.1`, which
          # pins libcrux-aead to the exact `=0.0.7`, which pins libcrux-aesgcm
          # to the exact `=0.0.7` in turn, so `cargo update` alone can't reach
          # 0.0.9 no matter what songbird does. hpke-rs-libcrux 0.7.0 already
          # requires the patched libcrux-aead; unblocking these two needs
          # hpke-rs (not songbird) to pick that up. Re-run `cargo update` and
          # drop entries here as songbird/serenity/hpke-rs catch up.
          ignore: "RUSTSEC-2026-0211,RUSTSEC-2026-0209,RUSTSEC-2026-0124,RUSTSEC-2026-0212,RUSTSEC-2026-0207,RUSTSEC-2026-0208,RUSTSEC-2026-0098,RUSTSEC-2026-0049,RUSTSEC-2026-0099,RUSTSEC-2026-0104"
