[package]
name = "lavalink-server"
description = "A small Lavalink v4 compatible audio node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lavalink-protocol = { path = "../protocol" }

# rc so Json<Arc<LoadResult>> serializes: the loader shares one result
# between its cache, the single-flight followers and the caller, and unwrapping
# the Arc at the REST edge would deep-copy the whole playlist back.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
futures-util.workspace = true
async-trait = "0.1"

# Deprecated upstream, but parser changes can reject application.yml files this
# port deliberately accepts. Replace only with fixture-backed compatibility tests.
serde_yaml = "0.9"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rand = "0.10"
subtle = "2"
sysinfo = "0.39"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
# Only the codecs/containers probe.rs's container_name() and the source managers
# actually produce: mp3/flac/aac/vorbis/pcm decoders, isomp4 (m4a) / mkv (webm) /
# ogg / wav containers. adpcm, alac, mp1, mp2, caf, aiff are never referenced.
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "flac", "aac", "vorbis", "pcm",
    "isomp4", "mkv", "ogg", "wav",
] }
# Never imported — this exists purely so Cargo's feature unification reaches
# songbird's symphonia, which is a different major version from ours and
# therefore a different crate entirely.
#
# songbird builds its codec/format registries from downstream-enabled Symphonia
# features. PCM is the RawAdapter pump path; mkv is the WebM/Opus direct path;
# AAC/isomp4 keep the direct input playable when yt-dlp has to fall back to m4a.
# Without PCM, LiveInput::promote silently finds no decoder for our ring — see
# ring.rs's songbird_can_promote_the_ring_into_a_playable_input.
symphonia-songbird = { package = "symphonia", version = "0.5", default-features = false, features = [
    "pcm", "mkv", "aac", "isomp4",
] }
# driver only — no gateway client. Lavalink receives voice state and voice server
# updates from its own client over REST, which is exactly the standalone driver's
# input, so serenity/twilight are not needed. tungstenite is the websocket backend
# the driver requires (it insists on exactly one).
songbird = { version = "0.6", default-features = false, features = [
    "driver",
    "rustls",
    "tungstenite",
] }
# Windowed-sinc resampling for resamplingQuality (LOW/MEDIUM/HIGH map to
# SincInterpolationParameters presets in audio/resample.rs). fft_resampler,
# the only default feature, pulls in realfft/num-complex for a resampler
# variant this node doesn't use — only the sinc/fast asynchronous resamplers
# are needed here.
rubato = { version = "5.0", default-features = false }
# The same WSOLA family upstream lavadsp uses for timescale. Bundled keeps the
# node self-contained on every supported target; cc + bindgen still require a
# C++ compiler and libclang.
soundtouch = { version = "0.5.4", default-features = false, features = ["bundled"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
# Exposes Songbird's mixer entry point so the YouTube-path benchmark measures
# the real Opus passthrough branch rather than a hand-written packet-copy proxy.
songbird = { version = "0.6", default-features = false, features = ["internals"] }
# Already in the tree transitively via axum; util just exposes oneshot so
# router wiring (fallbacks, layer ordering) can be tested as real HTTP calls
# instead of trusted by inspection.
tower = { version = "0.5", features = ["util"] }

# The lib and bin targets are built with libtest's harness, which rejects
# criterion's flags — cargo bench -- --save-baseline x used to die on them before
# reaching a single benchmark. Neither target has a #[bench] in it, so there is
# nothing to lose by keeping them out of cargo bench entirely.
[lib]
bench = false

[[bin]]
name = "lavalink-server"
path = "src/main.rs"
bench = false

[[bench]]
name = "ring"
harness = false

[[bench]]
name = "resample"
harness = false

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "youtube_path"
harness = false
